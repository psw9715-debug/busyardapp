<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0d11">
<title>차고지 안내</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="stylesheet" href="../src/guide/guide.css?v=202609270058">
</head>
<body>

<div id="bar">
  <span id="barDate">—</span>
  <span id="barCount">0대</span>
  <span class="grow"></span>
  <button id="btnRound" type="button">순회</button>
  <button id="btnPrint" type="button">인쇄</button>
</div>

<!-- 배치도 — 메인 -->
<section class="view" id="viewMap">
  <div id="map"><div id="zoomWrap"><div class="board" id="board"></div></div></div>
</section>

<!-- 키패드 -->
<section class="view" id="viewPad" hidden>
  <div id="entry">
    <div id="slots"><span class="fix">1</span><i></i><i></i><i></i></div>
    <div id="hint"></div>
  </div>
  <div id="pad">
    <button type="button" data-k="1">1</button>
    <button type="button" data-k="2">2</button>
    <button type="button" data-k="3">3</button>
    <button type="button" data-k="4">4</button>
    <button type="button" data-k="5">5</button>
    <button type="button" data-k="6">6</button>
    <button type="button" data-k="7">7</button>
    <button type="button" data-k="8">8</button>
    <button type="button" data-k="9">9</button>
    <button type="button" class="fn" id="btnCarPark">승용차</button>
    <button type="button" data-k="0">0</button>
    <button type="button" class="fn" id="btnClearKey">지움</button>
  </div>
</section>

<!-- 기록 -->
<section class="view" id="viewLog" hidden>
  <div id="log"></div>
  <div id="logfoot"><button type="button" id="btnCsv">엑셀용으로 복사</button></div>
</section>

<!-- 관리 -->
<section class="view" id="viewAdmin" hidden>
  <div id="admin">
    <div class="arow"><span>지금 버전</span><b id="admBuild">—</b></div>
    <div class="arow"><span>그날 자료</span><b id="admSource">—</b></div>
    <div class="arow"><span>2차고지 컷오프</span><b id="admCutoff">—</b></div>
    <button type="button" id="btnUpdate" class="abtn go">최신 버전 받기</button>
    <p class="ahint">깃허브에 올라간 새 버전을 강제로 받아온다. 적어 둔 차량번호는 지워지지 않는다.</p>
    <button type="button" id="btnReload" class="abtn">그날 자료 다시 받기</button>
    <button type="button" id="btnVoice2" class="abtn">안내 음성 켜기 / 끄기</button>

    <h3 class="ahead">보관</h3>
    <button type="button" id="btnSave" class="abtn go">오늘 판 저장</button>
    <p class="ahint">날짜별로 남는다. 나중에 불러와서 인쇄할 수 있다.</p>
    <div id="saves"></div>
    <button type="button" id="btnWipe" class="abtn danger">오늘 입력 전부 지우기</button>
    <p class="ahint">두 번 눌러야 지워진다.</p>
  </div>
</section>

<div id="tabs">
  <button type="button" class="on" data-v="Map">배치도</button>
  <button type="button" data-v="Pad">키패드</button>
  <button type="button" data-v="Log">기록</button>
  <button type="button" data-v="Admin">관리</button>
</div>

<!-- 전체화면 숫자 -->
<div id="big" hidden>
  <span class="tag" id="bigTag"></span>
  <svg id="bigSvg" viewBox="-50 -75 100 100" preserveAspectRatio="none" aria-hidden="true">
    <text class="g" id="bigText" x="0" y="0"
          font-family="-apple-system, Helvetica Neue, Arial, sans-serif"
          font-weight="900" font-size="100">1</text>
  </svg>
</div>

<!-- 시트 -->
<div id="sheet" hidden><div class="box">
  <h2 id="sheetTitle"></h2>
  <p id="sheetBody"></p>
  <div class="btns" id="sheetBtns"></div>
</div></div>

<!-- 인쇄 — 지금 쓰는 종이(구차고지.xlsx)와 같은 모양. 화면에는 안 보인다. -->
<div class="paper" id="paper">
  <div class="p-head"><b>구차고지</b><span id="pMeta"></span></div>
  <div class="p-map" id="pMap"></div>
</div>

<script type="module" src="../src/guide/ui.js?v=202609270058"></script>
</body>
</html>
