<!doctype html>
<meta charset="utf-8">
<title>guide.test</title>
<style>
  body { font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace; margin: 24px; background: #111; color: #ddd; }
  h2 { font-size: 14px; margin: 20px 0 6px; color: #8ab; }
  .ok { color: #6c6; }
  .no { color: #f66; font-weight: bold; }
  #sum { font-size: 18px; margin-bottom: 12px; }
</style>
<div id="sum">…</div>
<div id="out"></div>

<script type="module">
import { assign, place, clear, laneOf, yardOf, staysPut, computeCutoff, DEFAULT_CUTOFF }
  from '../src/guide/assign.js';
import { YARD12 } from '../src/guide/yard12-data.js';
import { NIGHT_0908 } from './guide.fixture.js';

let pass = 0, fail = 0;
const out = document.getElementById('out');

function group(name) {
  const h = document.createElement('h2');
  h.textContent = name;
  out.append(h);
}
function ok(name, got, want) {
  const good = JSON.stringify(got) === JSON.stringify(want);
  good ? pass++ : fail++;
  const d = document.createElement('div');
  d.className = good ? 'ok' : 'no';
  d.textContent = `${good ? 'PASS' : 'FAIL'}  ${name}` +
    (good ? '' : `\n      기대 ${JSON.stringify(want)}\n      실제 ${JSON.stringify(got)}`);
  d.style.whiteSpace = 'pre';
  out.append(d);
}

// 판을 만드는 도우미 -----------------------------------------------------
const car = (plate, out_) => ({ plate, rest: out_ === '휴차', out: out_ === '휴차' ? null : out_ });
/** 차를 차례로 넣어 판을 만든다 */
function board(list, opts) {
  let e = {};
  for (const c of list) {
    const r = assign(e, c, opts);
    if (r.ok) e = place(e, c, r.spot);
  }
  return e;
}
/** 자리들을 아무 차로나 채운다 (번호 9000번대는 어느 규칙에도 안 걸린다) */
function fill(entries, spots) {
  let e = { ...entries }, n = 9000;
  for (const s of spots) e[s] = { plate: n++, rest: false, out: '05:00' };
  return e;
}
const at = (e, plate) => Object.keys(e).find((s) => e[s].plate === plate) || null;

const Y1 = YARD12.yard1, Y2 = YARD12.yard2;

// 1. 배치 데이터 --------------------------------------------------------
group('배치 데이터');
ok('1차고지 순번행 29칸', Y1.seq.length, 29);
ok('1차고지 맨 뒷열 13칸', Y1.rear.length, 13);
ok('2차고지 1·2·3열', [Y2.lanes[1].length, Y2.lanes[2].length, Y2.lanes[3].length], [9, 9, 8]);
ok('2차고지 예비', [Y2.spare[2], Y2.spare[3]], ['2-27', '2-28']);
ok('전용칸', [Y1.reserved[1015], Y1.reserved[1016]], ['1-41', '1-42']);

// 2. 차고지 판정 --------------------------------------------------------
group('차고지 판정');
ok('1015 → 1차고지 (61번이 범위보다 먼저)', yardOf(1015), 1);
ok('1016 → 1차고지', yardOf(1016), 1);
ok('1012 → 2차고지', yardOf(1012), 2);
ok('1031 → 2차고지', yardOf(1031), 2);
ok('1732 → 2차고지', yardOf(1732), 2);
ok('1754 → 2차고지', yardOf(1754), 2);
ok('1142 → 1차고지', yardOf(1142), 1);
ok('1725 (6차고지) → 1차고지 방식', yardOf(1725), 1);
ok('1128 (한노) → 1차고지 방식', yardOf(1128), 1);
ok('1500 (모르는 번호) → 1차고지 방식', yardOf(1500), 1);

group('안내 숫자');
ok('1-1 앞줄', laneOf('1-1'), 1);
ok('1-2 뒷줄', laneOf('1-2'), 2);
ok('1-29 앞줄', laneOf('1-29'), 1);
ok('1-30 맨 뒷열', laneOf('1-30'), 3);
ok('1-42 맨 뒷열', laneOf('1-42'), 3);
ok('2-1 / 2-10 / 2-19', [laneOf('2-1'), laneOf('2-10'), laneOf('2-19')], [1, 2, 3]);
ok('2-27 은 2열, 2-28 은 3열', [laneOf('2-27'), laneOf('2-28')], [2, 3]);

group('휴차 판정');
ok('휴차', staysPut(car(1163, '휴차')), true);
ok('07:10 출차는 아침', staysPut(car(1154, '07:10')), false);
ok('12:40 출차는 낮 → 휴차 취급', staysPut(car(1164, '12:40')), true);
ok('13:35 출차도 낮', staysPut(car(1118, '13:35')), true);
ok('08:59 는 아직 아침', staysPut(car(1, '08:59')), false);

// 3. 1차고지 — 말씀하신 실제 플로우 --------------------------------------
group('1차고지 — 들으신 그대로');
{
  let e = {};
  const steps = [
    [car(1163, '휴차'), '1-42', 3],
    [car(1154, '07:10'), '1-1', 1],
    [car(1156, '05:20'), '1-2', 2],
    [car(1170, '05:20'), '1-3', 1],
    [car(1015, '05:45'), '1-41', 3],
  ];
  for (const [c, spot, lane] of steps) {
    const r = assign(e, c);
    ok(`${c.plate} ${c.rest ? '휴차' : c.out} → ${spot} (${lane}열)`,
       [r.ok, r.spot, r.lane], [true, spot, lane]);
    e = place(e, c, r.spot);
  }
}

group('1차고지 — 전용칸');
{
  const e0 = {};
  ok('1015, 1-41 빔', assign(e0, car(1015, '05:45')).spot, '1-41');
  const e1 = fill(e0, ['1-41']);
  ok('1015, 1-41 점유 → 최인접 1-40', assign(e1, car(1015, '05:45')).spot, '1-40');
  const e2 = fill(e0, ['1-42', '1-41']);
  ok('1016, 1-42·1-41 점유 → 1-40', assign(e2, car(1016, '휴차')).spot, '1-40');
  const e3 = fill(e0, ['1-41', '1-40']);
  ok('1015, 1-41·1-40 점유 → 1-42 (거리 1)', assign(e3, car(1015, '05:45')).spot, '1-42');
  ok('전용칸 이유', assign(e0, car(1016, '휴차')).reason, '1016 전용칸');
}

group('1차고지 — 넘칠 때');
{
  const rearFull = fill({}, Y1.rear);
  const r = assign(rearFull, car(1163, '휴차'));
  ok('맨 뒷열 만차 + 휴차 → 앞줄 첫 빈칸', [r.spot, r.lane, r.reason],
     ['1-1', 1, '맨 뒷열 만차 → 앞줄']);

  const seqFull = fill({}, Y1.seq);
  const r2 = assign(seqFull, car(1154, '07:10'));
  ok('순번행 만차 + 출차차 → 1-30 (앞쪽부터)', [r2.spot, r2.lane, r2.reason],
     ['1-30', 3, '순번행 만차 → 맨 뒷열']);

  const r3 = assign(fill(seqFull, ['1-30', '1-31']), car(1155, '휴차'));
  ok('순번 넘침과 휴차가 가운데서 만난다', r3.spot, '1-42');

  const all = fill({}, [...Y1.seq, ...Y1.rear]);
  ok('42칸 만차 → 자리를 만들지 않는다', assign(all, car(1154, '07:10')),
     { ok: false, kind: 'full', yard: 1 });
}

group('1차고지 — 지운 자리가 다음 차례');
{
  let e = board([car(1154, '07:10'), car(1156, '05:20'), car(1170, '05:20')]);
  ok('세 대 넣으면 1-3 까지', [at(e, 1154), at(e, 1156), at(e, 1170)], ['1-1', '1-2', '1-3']);
  e = clear(e, '1-2');
  ok('1-2 를 지우면 다음 차가 1-2 로', assign(e, car(1144, '06:00')).spot, '1-2');
}

group('1차고지 — 낮 출차');
ok('1164 (12:40) → 맨 뒷열', assign({}, car(1164, '12:40')).spot, '1-42');
ok('이유', assign({}, car(1164, '12:40')).reason, '낮 출차 → 맨 뒷열');

// 4. 2차고지 — 말씀하신 실제 플로우 --------------------------------------
group('2차고지 — 들으신 그대로');
{
  let e = {};
  const steps = [
    [car(1732, '05:30'), '2-1', 1],
    [car(1754, '05:50'), '2-2', 1],
    [car(1733, '08:00'), '2-10', 2],
  ];
  for (const [c, spot, lane] of steps) {
    const r = assign(e, c);
    ok(`${c.plate} ${c.out} → ${spot} (${lane}열)`, [r.ok, r.spot, r.lane], [true, spot, lane]);
    e = place(e, c, r.spot);
  }
  const laneFull = fill(e, Y2.lanes[1].slice(2));
  const r = assign(laneFull, car(1751, '05:20'));
  ok('1751 (05:20), 1열 만차 → 2-19 (3열)', [r.spot, r.lane, r.reason],
     ['2-19', 3, '1열 만차 → 3열']);
}

group('2차고지 — 늦은 차와 휴차는 가운데');
ok('휴차 → 2열', assign({}, car(1012, '휴차')).spot, '2-10');
ok('휴차 이유', assign({}, car(1012, '휴차')).reason, '휴차 → 2열');
ok('06:15 정각 → 2열', assign({}, car(1735, '06:15')).spot, '2-10');
ok('06:00 → 1열 (첫줄은 6시까지)', assign({}, car(1735, '06:00')).spot, '2-1');
ok('06:14 → 1열', assign({}, car(1735, '06:14')).spot, '2-1');
ok('낮 출차(12:40) → 2열', assign({}, car(1020, '12:40')).spot, '2-10');
{
  const lane2Full = fill({}, Y2.lanes[2]);
  ok('2열 만차 + 늦은 차 → 2-27', assign(lane2Full, car(1734, '08:00')).spot, '2-27');
  const fast = fill({}, [...Y2.lanes[1], ...Y2.lanes[3]]);
  ok('1·3열 만차 + 빠른 차 → 2-28', assign(fast, car(1752, '05:10')).spot, '2-28');
}

group('2차고지 — 컷오프를 바꾸면');
ok('06:20 차, 컷오프 06:15 → 2열', assign({}, car(1740, '06:20'), { cutoff: '06:15' }).lane, 2);
ok('06:20 차, 컷오프 06:30 → 1열', assign({}, car(1740, '06:20'), { cutoff: '06:30' }).lane, 1);

group('2차고지 — 시각을 몰라도 묻지 않는다');
{
  // 순서대로만 넣어도 아침에 빠져나가는 데 문제가 없다.
  const unknown = (n) => ({ plate: n, rest: false, out: null });
  ok('첫 차는 1열', assign({}, unknown(1740)).spot, '2-1');
  const l1 = fill({}, Y2.lanes[1]);
  ok('1열이 차면 2열', assign(l1, unknown(1740)).spot, '2-10');
  const l12 = fill(l1, Y2.lanes[2]);
  ok('2열도 차면 3열', assign(l12, unknown(1740)).spot, '2-19');
  const all = fill(l12, [...Y2.lanes[3], Y2.spare[2]]);
  ok('마지막은 예비', assign(all, unknown(1740)).spot, '2-28');
  ok('이유를 남긴다', assign({}, unknown(1740)).reason, '순서대로 1열');
}
ok('1차고지는 시각을 안 보므로 그냥 배정',
   assign({}, { plate: 1150, rest: false, out: null }).spot, '1-1');

group('2차고지 — 자리가 없으면 옆 줄로 넘긴다');
{
  const lane2Full = fill({}, [...Y2.lanes[2], Y2.spare[2]]);
  ok('2열·예비가 차면 늦은 차도 3열로', assign(lane2Full, car(1734, '08:00')).spot, '2-19');
  const fastFull = fill({}, [...Y2.lanes[1], ...Y2.lanes[3], Y2.spare[3]]);
  ok('1·3열이 차면 빠른 차도 2열로', assign(fastFull, car(1752, '05:10')).spot, '2-10');
  const everything = fill({}, [...Y2.lanes[1], ...Y2.lanes[2], ...Y2.lanes[3],
                               Y2.spare[2], Y2.spare[3]]);
  ok('28칸이 다 차야 멈춘다', assign(everything, car(1752, '05:10')).kind, 'full');
}

// 5. 중복 → 이동 --------------------------------------------------------
group('같은 차가 다시 들어오면 옮긴다');
{
  const e = board([car(1154, '07:10'), car(1156, '05:20')]);
  const r = assign(e, car(1154, '07:10'));
  ok('제 자리가 비어 있으면 그대로', [r.ok, r.kind, r.from, r.spot], [false, 'move', '1-1', '1-1']);

  // 순회 때 출차차로 적었는데 알고 보니 내일 휴차 — 맨 뒷열로 옮겨야 한다
  const r2 = assign(e, car(1154, '휴차'));
  ok('상태가 바뀌면 옛 자리에서 새 자리로', [r2.kind, r2.from, r2.spot, r2.lane],
     ['move', '1-1', '1-42', 3]);
  const moved = place(e, car(1154, '휴차'), r2.spot, { from: r2.from });
  ok('옮기면 옛 자리가 빈다', [moved['1-1'], at(moved, 1154)], [undefined, '1-42']);
}
{
  let e = board([car(1163, '휴차'), car(1154, '07:10')]);
  const r = assign(e, car(1163, '휴차'));
  ok('휴차 1163 은 1-42 에 있다', [r.kind, r.from, r.spot], ['move', '1-42', '1-42']);
  e = place(e, car(1163, '휴차'), r.spot, { from: r.from });
  ok('옮기면 자리가 하나뿐', Object.keys(e).filter((s) => e[s].plate === 1163), ['1-42']);
}

// 6. 컷오프 자동 산출 ----------------------------------------------------
group('컷오프 자동 산출');
ok('0908 실측 → 06:15', computeCutoff(NIGHT_0908), DEFAULT_CUTOFF);
ok('2차고지 대상이 없으면 기본값', computeCutoff([]), DEFAULT_CUTOFF);

// 7. 실전 리허설 --------------------------------------------------------
group('실전 리허설 — 0908 근무일 실측 67대, 순서를 섞어 100번');
{
  // 2차고지는 소스상 30대가 들어오는데 자리는 28칸뿐이다. 남는 2대에게
  // 억지로 자리를 만들지 않고 'full' 로 돌려주는 것이 맞다.
  let badLane = 0, badDup = 0, badYard = 0;
  const shortfalls = new Set(), overflowYards = new Set(), placedCounts = new Set();
  for (let trial = 0; trial < 100; trial++) {
    const order = [...NIGHT_0908];
    for (let i = order.length - 1; i > 0; i--) {           // 진입 순서는 그날그날 다르다
      const j = ((trial * 7919 + i * 104729) % (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    let e = {}, short = 0;
    for (const c of order) {
      const r = assign(e, c, { cutoff: DEFAULT_CUTOFF });
      if (!r.ok) { short++; overflowYards.add(r.yard); continue; }
      if (laneOf(r.spot) !== r.lane) badLane++;
      if (yardOf(c.plate) !== Number(r.spot[0])) badYard++;
      e = place(e, c, r.spot);
    }
    shortfalls.add(short);
    placedCounts.add(Object.keys(e).length);
    const plates = Object.values(e).map((x) => x.plate);
    if (new Set(plates).size !== plates.length) badDup++;
  }
  ok('진입 순서가 어떻든 65대가 자리를 받는다', [...placedCounts], [65]);
  ok('못 받는 것은 늘 2대뿐', [...shortfalls], [2]);
  ok('넘치는 곳은 2차고지뿐 (28칸에 30대)', [...overflowYards], [2]);
  ok('한 차가 두 자리에 들어가지 않는다', badDup, 0);
  ok('안내 숫자가 자리와 어긋나지 않는다', badLane, 0);
  ok('차고지를 잘못 보내지 않는다', badYard, 0);
}

group('실전 리허설 — 2열이 앞뒤보다 늦다');
{
  let e = {};
  for (const c of NIGHT_0908) {
    const r = assign(e, c, { cutoff: DEFAULT_CUTOFF });
    if (r.ok) e = place(e, c, r.spot);
  }
  const timeOf = (s) => (e[s] && (e[s].rest || e[s].out >= '09:00' ? '24:00' : e[s].out)) || null;
  const lane = (n) => [...YARD12.yard2.lanes[n], YARD12.yard2.spare[n]]
    .filter((s) => s && e[s]).map(timeOf);
  const mid = lane(2), front = lane(1), back = lane(3);
  const latestSide = [...front, ...back].sort().pop();
  const earliestMid = [...mid].sort()[0];
  ok('2열에 차가 들어갔다', mid.length > 0, true);
  ok('가운데(2열)의 가장 빠른 차 ≥ 앞뒤의 가장 늦은 차',
     earliestMid >= latestSide, true);

  const n1 = Object.keys(e).filter((s) => s.startsWith('1-')).length;
  const n2 = Object.keys(e).filter((s) => s.startsWith('2-')).length;
  ok('1차고지 37대가 42칸에 다 들어간다', n1, 37);
  ok('2차고지는 28칸을 꽉 채운다', n2, 28);
}

// ----------------------------------------------------------------------
document.getElementById('sum').textContent = `PASS ${pass}  FAIL ${fail}`;
document.getElementById('sum').className = fail ? 'no' : 'ok';
document.title = fail ? `FAIL ${fail}` : `PASS ${pass}`;
</script>
