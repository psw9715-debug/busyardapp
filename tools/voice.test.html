<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>voice.js 테스트</title>
<style>
  body { font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace; background:#14140f; color:#e8e2d2; padding:24px; }
  h2 { color:#e6a23c; font-size:14px; margin:20px 0 6px; }
  .fail { color:#ff8f6b; white-space:pre; }
  .sum { margin-top:24px; padding:12px 16px; border-radius:8px; font-size:16px; font-weight:700; }
  .sum.ok { background:#20361f; color:#a9d18e; }
  .sum.no { background:#3a1f18; color:#ff8f6b; }
</style>
</head>
<body>
<div id="out"></div>
<script>
// ---- iOS 사파리 흉내 ----------------------------------------------------
// 사파리는 한 세션의 전사를 누적해 돌려준다. 말하는 중에는 마지막 항목을
// 계속 갈아치우다가(중간 결과), 확정되면 그 항목을 굳히고 다음으로 넘어간다.
// 그리고 발화가 끝나면 continuous 와 무관하게 스스로 종료한다.
window.__instances = [];
class MockSR {
  constructor() {
    this.finals = [];
    this.interim = null;
    this._started = false;
    window.__instances.push(this);
    window.__sr = this;
  }
  start() {
    if (this._started) { const e = new Error('already started'); e.name = 'InvalidStateError'; throw e; }
    this._started = true;
    this.finals = [];
    this.interim = null;
    if (this.onstart) this.onstart();
  }
  abort() { this._end(); }
  stop() { this._end(); }
  _end() {
    if (!this._started) return;
    this._started = false;
    if (this.onend) this.onend();
  }
  _emit() {
    const list = this.finals.map(t => ({ 0: { transcript: t }, isFinal: true, length: 1 }));
    if (this.interim !== null) list.push({ 0: { transcript: this.interim }, isFinal: false, length: 1 });
    list.length = list.length;
    if (this.onresult) this.onresult({ results: list });
  }
  /** 말하는 중 — 마지막 중간 결과를 갈아치운다 */
  say(text) { this.interim = text; this._emit(); }
  /** 확정 — 이 부분은 더 이상 바뀌지 않는다 */
  finalize(text) { this.finals.push(text); this.interim = null; this._emit(); }
  fail(name) { if (this.onerror) this.onerror({ error: name }); }
}
window.SpeechRecognition = MockSR;
window.webkitSpeechRecognition = MockSR;
</script>
<script type="module">
import { createVoice } from '../src/voice.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
const log = (html, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html; out.appendChild(d); };
function eq(a_, e_, label) {
  const a = JSON.stringify(a_), e = JSON.stringify(e_);
  if (a === e) pass++; else { fail++; log(`  FAIL  ${label}\n        기대 ${e}\n        실제 ${a}`, 'fail'); }
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function harness(settleMs = 100000) {   // 기본은 스스로 확정하지 않게 아주 길게
  const tokens = [];
  const states = [];
  const heard = [];
  const v = createVoice({
    onToken: t => tokens.push(t.type === 'plate' ? t.plate : `<${t.type}>`),
    onInterim: t => heard.push(t),
    onStatus: s => states.push(s),
    settleMs,
  });
  return { v, tokens, states, heard };
}

log('<h2>▶ 말하는 도중에는 확정하지 않는다 (현장에서 터진 문제)</h2>');
{
  // "천칠백이십사" 를 말하면 사파리는 조각조각 중간 결과를 흘린다.
  // 예전 코드는 첫 조각 "천"을 1000으로 확정해 버리고 다음 자리로 넘어갔다.
  const { v, tokens, heard } = harness();
  v.start();
  const sr = window.__sr;
  sr.say('천');
  eq(tokens, [], '"천"만 들렸을 때 확정하지 않음');
  sr.say('천칠백');
  eq(tokens, [], '"천칠백"에서도 확정하지 않음');
  sr.say('천칠백이십사');
  eq(tokens, [], '완성돼도 확정 전에는 넣지 않음');
  eq(heard.length > 0, true, '말하는 중에도 화면에는 보여준다');
  sr.finalize('천칠백이십사');
  eq(tokens, ['1724'], '확정되고 나서 한 번만 입력');
  v.stop();
}
{
  const { v, tokens } = harness();
  v.start();
  const sr = window.__sr;
  sr.say('천백');
  sr.finalize('천백삼십사');
  eq(tokens, ['1134'], '중간에 다르게 들렸어도 확정값이 들어감');
  v.stop();
}

log('<h2>▶ 확정 없이 세션이 끝나도 잃지 않는다</h2>');
{
  const { v, tokens } = harness();
  v.start();
  const sr = window.__sr;
  sr.say('천칠백이십사');
  sr._end();
  eq(tokens, ['1724'], '말은 끝났으니 확정으로 보고 입력');
  v.stop();
}
{
  const { v, tokens } = harness();
  v.start();
  const sr = window.__sr;
  sr.finalize('천사십이');
  sr.say('천백삼십사');
  sr._end();
  eq(tokens, ['1042', '1134'], '확정분과 미확정분이 섞여도 중복·누락 없음');
  v.stop();
}

log('<h2>▶ 말이 멎으면 확정을 기다리지 않고 넘어간다 (속도)</h2>');
{
  const { v, tokens } = harness(120);
  v.start();
  const sr = window.__sr;
  sr.say('천');
  sr.say('천칠백');
  sr.say('천칠백이십사');       // 여기서 말이 멎음
  eq(tokens, [], '멎은 직후에는 아직 아님');
  await sleep(200);
  eq(tokens, ['1724'], '사파리 확정을 기다리지 않고 넘어감');
  sr.finalize('천칠백이십사');   // 뒤늦게 확정이 와도
  eq(tokens, ['1724'], '같은 값이 두 번 들어가지 않음');
  v.stop();
}
{
  const { v, tokens } = harness(120);
  v.start();
  const sr = window.__sr;
  sr.say('천칠백이십사');
  await sleep(200);
  eq(tokens, ['1724'], '첫 번째 자리');
  sr.finalize('천칠백이십사');
  sr.say('천오백육');            // 이어서 다음 차
  await sleep(200);
  eq(tokens, ['1724', '1506'], '이어지는 자리도 스스로 확정');
  v.stop();
}
{
  const { v, tokens } = harness(120);
  v.start();
  const sr = window.__sr;
  sr.say('천칠백이십사');
  await sleep(200);
  v.stop();                      // 확정 후 중지
  await sleep(200);
  eq(tokens, ['1724'], '중지해도 이미 넣은 것이 다시 들어가지 않음');
}

log('<h2>▶ 누적 전사에서 새로 늘어난 것만 처리</h2>');
{
  const { v, tokens } = harness();
  v.start();
  const sr = window.__sr;
  sr.finalize('천사십이');
  eq(tokens, ['1042'], '첫 발화');
  sr.finalize('천백삼십사');
  eq(tokens, ['1042', '1134'], '두 번째는 새 것만 추가 (중복 없음)');
  sr.finalize('공차');
  eq(tokens, ['1042', '1134', '<skip>'], '명령도 순서대로');
  v.stop();
}

log('<h2>▶ 발화 종료 후 자동 재시작 (사파리는 continuous 무시)</h2>');
{
  const { v, tokens } = harness();
  v.start();
  const first = window.__sr;
  first.finalize('천사십이');
  first._end();
  await sleep(300);
  const second = window.__sr;
  eq(second._started, true, '자동으로 다시 듣기 시작');
  second.finalize('천백삼십사');
  eq(tokens, ['1042', '1134'], '재시작 후에도 이어서 인식');
  eq(tokens.filter(t => t === '1042').length, 1, '재시작 때 앞 내용이 중복 처리되지 않음');
  v.stop();
}

log('<h2>▶ 중지하면 재시작하지 않음</h2>');
{
  const { v } = harness();
  v.start();
  const sr = window.__sr;
  v.stop();
  await sleep(300);
  eq(sr._started, false, '멈춘 뒤에는 다시 켜지지 않음');
  eq(v.isOn(), false, 'isOn false');
}

log('<h2>▶ 오류 처리</h2>');
{
  const { v, states } = harness();
  v.start();
  window.__sr.fail('no-speech');
  eq(states.includes('denied'), false, 'no-speech는 무시하고 계속');
  window.__sr.fail('not-allowed');
  eq(states.includes('denied'), true, '권한 거부는 denied 상태로');
  eq(v.isOn(), false, '권한 거부되면 스스로 꺼짐');
  v.stop();
}
{
  const { v, states } = harness();
  v.start();
  window.__sr.fail('network');
  eq(states.includes('network'), true, '전파 문제는 network 상태로');
  v.stop();
}

log('<h2>▶ 안내 음성 되먹임 차단</h2>');
{
  const { v, tokens } = harness();
  v.start();
  v.muteFor(200);
  window.__sr.finalize('천사십이');
  eq(tokens, [], '차단 구간에는 자기 목소리를 먹지 않음');
  await sleep(260);
  window.__sr.finalize('천백삼십사');
  eq(tokens, ['1134'], '차단이 풀리면 다시 인식');
  v.stop();
}

log(`통과 ${pass} / 실패 ${fail}`, `sum ${fail === 0 ? 'ok' : 'no'}`);
document.title = fail === 0 ? `PASS ${pass}` : `FAIL ${fail}`;
</script>
</body>
</html>
