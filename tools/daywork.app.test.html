<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>특이사항 앱 테스트</title>
<style>
  body { font: 13px/1.6 ui-monospace, Consolas, monospace; background:#14140f; color:#e8e2d2; padding:16px; }
  .fail { color:#ff8f6b; }
  .ok { color:#a9d18e; }
  h2 { color:#d9c98a; font-size:13px; margin:14px 0 4px; }
  iframe { position:absolute; left:-9999px; width:390px; height:844px; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
// 앱을 실제로 띄워 눌러 보는 검사.
// 음성은 가짜 엔진을 끼워 넣어 **실제 흐름 그대로** 돌린다 (listen.js -> entry.js -> 화면).
// entry.js 의 순수 로직은 daywork.test.html 이 맡는다.
//
// 끝나면 document.title 이 "PASS n" / "FAIL n" 이 된다.
// 서버가 있어야 모듈을 읽는다:  python -m http.server 5181  뒤 /tools/daywork.app.test.html
const out = document.getElementById('out');
let pass = 0, fail = 0;
const log = (t, cls) => { const d = document.createElement('div'); d.className = cls || ''; d.textContent = t; out.appendChild(d); };
const head = (t) => { const h = document.createElement('h2'); h.textContent = t; out.appendChild(h); };
const eq = (actual, expected, label) => {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a === e) { pass++; log(`  ok   ${label}`, 'ok'); }
  else { fail++; log(`  FAIL ${label}\n       기대 ${e}\n       실제 ${a}`, 'fail'); }
};
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (ok, tries = 400) => {
  for (let i = 0; i < tries; i++) { if (ok()) return true; await wait(20); }
  return ok();
};

/** 가짜 음성 엔진 — 사파리가 주는 것과 같은 모양으로 결과를 흘린다 */
class FakeSR {
  constructor() { FakeSR.last = this; this.started = false; }
  // live: onstart 가 지나가 listen.js 가 결과를 받을 준비가 된 상태
  start() { this.started = true; setTimeout(() => { this.live = true; this.onstart && this.onstart(); }, 0); }
  abort() { this.ended(); }
  stop() { this.ended(); }
  ended() {
    if (!this.started) return;
    this.started = false; this.live = false;
    setTimeout(() => this.onend && this.onend(), 0);
  }
  /** parts: [[말, 확정여부], ...] — 사파리는 세션 시작부터의 전사를 누적해서 준다 */
  emit(parts) {
    const results = parts.map(([transcript, isFinal]) => ({ 0: { transcript }, isFinal, length: 1 }));
    results.length = parts.length;
    this.onresult && this.onresult({ results });
  }
}

function wipe() {
  for (const k of Object.keys(localStorage)) if (k.startsWith('daywork:')) localStorage.removeItem(k);
  localStorage.removeItem('busyard:ghtoken');     // 검사 중에 진짜로 올리는 일이 없게
  localStorage.removeItem('daywork:ghtoken');
}

let frame = null;
/**
 * 앱을 띄운다. fresh=true 면 저장된 판까지 비우고 새로 시작한다.
 *
 * 순서가 중요하다 — 앱은 화면을 벗어날 때(pagehide) 판을 저장한다. 먼저 지우고
 * iframe 을 없애면 옛 판이 되살아나 다음 검사에 섞인다.
 */
async function app(fresh) {
  if (frame) { frame.remove(); frame = null; await wait(50); }
  if (fresh) wipe();
  frame = document.createElement('iframe');
  frame.src = '../daywork/index.html';
  document.body.appendChild(frame);
  await until(() => {
    const d = frame.contentDocument;
    return d && d.getElementById('padKeys') && d.getElementById('padKeys').children.length > 0;
  });
  frame.contentWindow.confirm = () => true;
  frame.contentWindow.SpeechRecognition = FakeSR;     // 엔진은 쓸 때 찾으므로 지금 끼워도 된다
  return frame.contentDocument;
}

const $ = (d, id) => d.getElementById(id);
const cards = (d) => [...$(d, 'cards').querySelectorAll('li')]
  .map((li) => [li.querySelector('.no').textContent, li.querySelector('.what').textContent, li.className]);
const padKey = (d, label) => [...$(d, 'padKeys').children].find((b) => b.textContent === label);
const tap = (btn) => btn.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true }));
const logRows = (d) => [...$(d, 'logRows').querySelectorAll('li')].map((li) => li.textContent);

/**
 * 음성을 켜고 **실제로 듣기 시작할 때까지** 기다린다.
 *
 * listen.js 는 onstart 가 와야 running 이 되고, 그 전에 온 결과는 버린다
 * (끊은 뒤 뒤늦게 도착한 결과를 막기 위한 것). 가짜 엔진도 같은 순서를 지켜야
 * 하므로, 화면 상태가 '듣는 중' 이 된 다음에 말을 흘린다.
 */
async function mic(d) {
  $(d, 'mic').click();
  await until(() => FakeSR.last && FakeSR.last.live);
  return FakeSR.last;
}

/**
 * 한 마디 말한다.
 * 한 마디를 받을 때마다 listen.js 가 세션을 끊었다 다시 켜므로(빈 종이에서 시작),
 * 다시 '듣는 중' 이 될 때까지 기다렸다 흘린다.
 */
async function say(d, text) {
  // 화면 상태는 끊긴 틈에도 '듣는 중' 그대로다. 엔진이 실제로 살아났는지를 본다.
  await until(() => FakeSR.last && FakeSR.last.live);
  FakeSR.last.emit([[text, true]]);
}

// ───────────────────────────────────────────────────────────
head('0. 켜자마자 — 시트는 실제로 안 보여야 한다');
{
  const d = await app(true);
  const shown = (id) => frame.contentWindow.getComputedStyle($(d, id)).display;
  // hidden 속성만 보면 놓친다. .sheet-bg 에 display 를 주면 hidden 이 먹지 않는다.
  eq(shown('logSheet'), 'none', '기록 시트가 덮고 있지 않다');
  eq(shown('diagSheet'), 'none', '진단 시트가 덮고 있지 않다');
  eq($(d, 'pad').hidden, true, '키패드는 접혀 있다');
  eq($(d, 'btnConfirm').disabled, true, '받는 번호가 없으면 [확인] 은 눌리지 않는다');
}

head('1. 음성 전체 흐름 — 번호 다음 내용');
{
  const d = await app(true);
  await mic(d);

  await say(d, '천백이십');
  await until(() => $(d, 'plate').textContent === '1120', 100);
  eq($(d, 'plate').textContent, '1120', '"천백이십" -> 1120');
  eq($(d, 'stage').classList.contains('symptom'), true, '내용 대기로 바뀐다');
  eq(cards(d).length, 0, '아직 카드는 없다');

  await say(d, '대차');
  await wait(900);
  eq(cards(d).length, 0, '내용을 말해도 1초쯤은 더 기다린다 (뒷말이 올 수 있다)');

  await until(() => cards(d).length === 1, 150);
  eq(cards(d), [['1120', '대차', '']], '2초쯤 지나면 카드가 된다');
  eq($(d, 'plate').textContent, '번호 대기', '다시 번호 대기로');
}

head('2. [확인] — 2초를 기다리지 않고 바로 넣는다');
{
  const d = await app(true);
  await mic(d);
  await say(d, '천백십삼');
  await until(() => $(d, 'plate').textContent === '1113', 100);

  await say(d, '에어컨 고장');
  await wait(150);
  eq(cards(d).length, 0, '아직 기다리는 중');

  $(d, 'btnConfirm').click();
  await until(() => cards(d).length === 1, 60);
  eq(cards(d), [['1113', '에어컨 고장', '']], '누르는 즉시 들어간다');
}

head('3. 한 호흡에 불러도 된다');
{
  const d = await app(true);
  await mic(d);
  await say(d, '천칠백사십구 브레이크 소음');
  await until(() => cards(d).length === 1, 200);
  eq(cards(d), [['1749', '브레이크 소음', '']], '띄어쓰기가 살아 있다');
}

head('4. 내용 안의 번호는 내용이다 (실제로 막혔던 말)');
{
  const d = await app(true);
  await mic(d);
  await say(d, '천삼백오십이');
  await until(() => $(d, 'plate').textContent === '1352', 100);
  await say(d, '1305호로 대차');
  await until(() => cards(d).length === 1, 250);
  eq(cards(d), [['1352', '1305호로 대차', '']], '1305 를 다음 차로 오해하지 않는다');
}

head('4-2. 번호만 달랑 말하면 다음 차');
{
  const d = await app(true);
  await mic(d);
  await say(d, '천백십삼');
  await until(() => $(d, 'plate').textContent === '1113', 100);
  await say(d, '천백이십');
  await until(() => cards(d).length === 1, 250);
  eq(cards(d), [['1113', '—', 'nosymptom']], '앞 차는 내용 없음으로 남는다');
  eq($(d, 'plate').textContent, '1120', '새 번호를 받고 있다');
}

head('5. [없음] · [이전]');
{
  const d = await app(true);
  await mic(d);
  await say(d, '천백이십');
  await until(() => $(d, 'plate').textContent === '1120', 100);
  $(d, 'btnSkip').click();
  await until(() => $(d, 'plate').textContent === '번호 대기', 60);
  eq(cards(d).length, 0, '[없음] 은 카드를 만들지 않는다');

  await say(d, '천백이십일 세차');
  await until(() => cards(d).length === 1, 200);
  $(d, 'btnBack').click();
  await until(() => cards(d).length === 0, 60);
  eq(cards(d).length, 0, '[이전] 이 방금 카드를 되돌린다');
}

head('6. 키패드');
{
  const d = await app(true);
  $(d, 'btnPad').click();
  eq($(d, 'pad').hidden, false, '열린다');
  tap(padKey(d, '7')); tap(padKey(d, '0'));
  eq($(d, 'padEcho').textContent, '170·', '두 자리');
  tap(padKey(d, '지우기'));
  eq($(d, 'padEcho').textContent, '17··', '한 자리 지워진다');
  tap(padKey(d, '4')); tap(padKey(d, '9'));
  await until(() => $(d, 'plate').textContent === '1749', 60);
  eq($(d, 'plate').textContent, '1749', '세 자리가 차면 번호가 된다');
}

head('7. 명부에 없는 번호도 받는다');
{
  const d = await app(true);
  await mic(d);
  await say(d, '천구백구십구 엔진 고장');
  await until(() => cards(d).length === 1, 200);
  eq(cards(d), [['1999', '엔진 고장', 'unknown']], '막지 않고 unknown 으로 표시');
}

head('8. 기록 — 바뀌기 전 값이 남는다');
{
  const d = await app(true);
  await mic(d);
  await say(d, '천백이십 대차');
  await until(() => cards(d).length === 1, 200);
  await say(d, '천백이십 세차');                 // 같은 차를 다시 -> 덮어쓰기
  await until(() => cards(d)[0] && cards(d)[0][1] === '세차', 200);
  eq(cards(d), [['1120', '세차', '']], '카드는 하나, 내용은 새것');

  $(d, 'btnLog').click();
  const rows = logRows(d);
  eq(rows.some((r) => r.includes('수정') && r.includes('대차') && r.includes('세차')), true,
    '"수정  1120  대차 → 세차" 가 남는다');
  eq(rows.some((r) => r.includes('입력') && r.includes('대차')), true, '처음 입력도 남는다');
  $(d, 'logClose').click();
  eq($(d, 'logSheet').hidden, true, '닫힌다');
}

head('9. 지우기도 기록에 남는다');
{
  const d = await app(true);
  await mic(d);
  await say(d, '천백이십 대차');
  await until(() => cards(d).length === 1, 200);
  // 지우기는 고치기 창 안에 있다 — 목록을 잘못 눌렀다고 기록이 날아가지 않게
  $(d, 'cards').querySelector('li').click();
  $(d, 'editDelete').click();
  await until(() => cards(d).length === 0, 60);

  $(d, 'btnLog').click();
  eq(logRows(d).some((r) => r.includes('지움') && r.includes('1120') && r.includes('대차')), true,
    '지운 것도 내용과 함께 남는다');
  $(d, 'logClose').click();
}

head('10. 진단 — 버전과 최신 버전 받기');
{
  const d = await app(true);
  $(d, 'btnDiag').click();
  eq($(d, 'diagSheet').hidden, false, '열린다');
  const info = $(d, 'diagInfo').textContent;
  eq(/\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(info), true, '빌드 시각이 보인다');
  eq(info.includes('181대'), true, '명부 개수가 보인다');
  eq(Boolean($(d, 'diagUpdate')), true, '"최신 버전 받기" 가 있다');
  eq(frame.contentWindow.getComputedStyle($(d, 'diagSheet')).display, 'flex', '실제로 보인다');
  $(d, 'diagClose').click();
  eq(frame.contentWindow.getComputedStyle($(d, 'diagSheet')).display, 'none', '실제로 사라진다');
}

head('11. PC 로 보내기 — 막아야 할 때 막는다');
{
  const d = await app(true);
  $(d, 'btnSend').click();
  await until(() => $(d, 'sendNote').textContent.length > 0, 60);
  eq($(d, 'sendNote').textContent, '보낼 것이 없습니다', '보낼 것이 없으면 올리지 않는다');

  await mic(d);
  await say(d, '천백이십 대차');
  await until(() => cards(d).length === 1, 200);
  $(d, 'btnSend').click();
  await until(() => $(d, 'sendNote').textContent.includes('토큰'), 60);
  eq($(d, 'sendNote').textContent.includes('토큰이 없습니다'), true, '토큰이 없으면 안내만 한다');
}

head('12. 앱을 다시 켜도 남아 있다');
{
  let d = await app(true);
  await mic(d);
  await say(d, '천백이십일 대차');
  await until(() => cards(d).length === 1, 200);

  d = await app();                                    // 지우지 않고 다시 켠다
  eq(cards(d), [['1121', '대차', '']], '카드가 그대로');
  eq($(d, 'plate').textContent, '번호 대기', '기다리던 번호 없이 시작');

  $(d, 'btnClear').click();
  await until(() => cards(d).length === 0, 60);
  eq($(d, 'count').textContent, '0', '[오늘 지우기] 로 비었다');
  $(d, 'btnLog').click();
  eq(logRows(d).some((r) => r.includes('전체 지움')), true, '전체 지움도 기록에 남는다');
}

head('13. 토큰 — 이 앱에서 바로 넣을 수 있어야 한다');
{
  const d = await app(true);
  $(d, 'btnDiag').click();
  eq(Boolean($(d, 'btnToken')), true, '[진단]에 토큰 넣기 버튼이 있다');
  eq($(d, 'diagInfo').textContent.includes('한 번만 넣으면'), true,
    '없을 때 순회앱이 아니라 여기서 넣으라고 한다');

  frame.contentWindow.prompt = () => 'ghp_테스트토큰';
  $(d, 'btnToken').click();
  await until(() => $(d, 'diagInfo').textContent.includes('있음'), 60);
  eq($(d, 'diagInfo').textContent.includes('이 앱에 넣은 것'), true, '넣은 토큰을 쓴다고 알려 준다');

  // 넣은 뒤에는 보내기가 토큰 타령을 하지 않는다 (실제로 올리지는 않는다)
  $(d, 'diagClose').click();
  eq(localStorage.getItem('daywork:ghtoken'), 'ghp_테스트토큰', '이 앱 키로 저장된다');

  frame.contentWindow.prompt = () => '';
  $(d, 'btnDiag').click();
  $(d, 'btnToken').click();
  await until(() => !localStorage.getItem('daywork:ghtoken'), 60);
  eq(localStorage.getItem('daywork:ghtoken'), null, '비우면 지워진다');
  $(d, 'diagClose').click();
}

head('14. 천천히 끊어 불러도 번호가 사라지지 않는다');
{
  const d = await app(true);
  await mic(d);

  // "천백…" 에서 한 번 멈춘다 (사파리는 아직 말하는 중으로 흘려 준다)

  await wait(1900);
  eq($(d, 'plate').textContent, '번호 대기', '반쯤 들린 것을 번호로 확정하지 않는다');

  // 이어서 마저 부른다
  FakeSR.last.emit([['천백이십', false]]);
  await until(() => $(d, 'plate').textContent === '1120', 200);
  eq($(d, 'plate').textContent, '1120', '이어 부른 뒤에 1120 이 된다');
}

  eq($(d, 'plate').textContent, '1120', '다 부르면 1120 이 된다');
}

head('18. 명부에 없는 번호도 끝내 그 번호면 받는다');
{
  const d = await app(true);
  await mic(d);
  FakeSR.last.emit([['1999', false]]);
  await until(() => $(d, 'plate').textContent === '1999', 400);
  eq($(d, 'plate').textContent, '1999', '기다린 뒤 그대로 받는다');
  eq($(d, 'plate').classList.contains('unknown'), true, '명부에 없다고 노랗게 표시만');
}

head('19. 사파리가 세션을 끊어도 1000 이 들어가지 않는다');
{
  // 사파리는 발화가 끝나면 인식 세션을 끊는다. 번호를 부르다 쉬면 그 길로 들어온다.
  const d = await app(true);
  await mic(d);
  FakeSR.last.emit([['1000', true]]);
  FakeSR.last.ended();                      // 사파리가 세션을 닫는다
  await wait(900);
  eq($(d, 'plate').textContent, '번호 대기', '덜 불린 번호를 넣지 않는다');
  eq(cards(d).length, 0, '카드도 만들지 않는다');
  eq($(d, 'heard').textContent.includes('덜 들렸습니다'), true, '버렸다고 알려 준다');

  $(d, 'btnDiag').click();
  eq([...$(d, 'diagHeard').querySelectorAll('li')].some((li) => li.textContent.includes('(버림) 1000')),
    true, '[진단]에 무엇을 버렸는지 남는다');
  $(d, 'diagClose').click();
}

head('20. 세션이 끊겨도 다 부른 번호는 들어간다');
{
  const d = await app(true);
  await mic(d);
  FakeSR.last.emit([['1120', true]]);
  FakeSR.last.ended();
  await until(() => $(d, 'plate').textContent === '1120', 150);
  eq($(d, 'plate').textContent, '1120', '명부에 있는 번호는 그대로 받는다');
}

head('21. 카드를 눌러 그 자리에서 고친다');
{
  const d = await app(true);
  await mic(d);
  await say(d, '1021 요 소수 보충');
  await until(() => cards(d).length === 1);
  eq(cards(d)[0].slice(0, 2), ['1021', '요 소수 보충'], '잘못 들어간 채로 쌓였다');

  const li = $(d, 'cards').querySelector('li');
  li.click();
  eq(d.defaultView.getComputedStyle($(d, 'editSheet')).display !== 'none', true, '고치기 창이 열린다');
  eq($(d, 'editPlate').value, '1021', '번호가 들어 있다');
  eq($(d, 'editText').value, '요 소수 보충', '내용이 들어 있다');
  await until(() => $(d, 'status').textContent === '꺼짐');
  eq($(d, 'status').textContent, '꺼짐', '고치는 동안 음성을 멈춘다');

  $(d, 'editText').value = '요소수 보충';
  $(d, 'editSave').click();
  eq(cards(d)[0].slice(0, 2), ['1021', '요소수 보충'], '고쳐진다');
  eq(cards(d).length, 1, '카드가 늘지 않는다');
  eq(d.defaultView.getComputedStyle($(d, 'editSheet')).display, 'none', '창이 닫힌다');
  await until(() => $(d, 'status').textContent === '듣는 중');
  eq($(d, 'status').textContent, '듣는 중', '멈췄던 음성이 다시 켜진다');

  // 바뀌기 전 내용이 기록에 남는다
  $(d, 'btnLog').click();
  eq($(d, 'logRows').textContent.includes('요 소수 보충 → 요소수 보충'), true, '기록에 전후가 남는다');
  $(d, 'logClose').click();
}

head('22. 고치기 창에서 번호도 바꾸고, 지우기도 한다');
{
  const d = await app(true);
  await mic(d);
  await say(d, '1021 대차');
  await until(() => cards(d).length === 1);

  $(d, 'cards').querySelector('li').click();
  $(d, 'editPlate').value = '1022';
  $(d, 'editSave').click();
  eq(cards(d)[0].slice(0, 2), ['1022', '대차'], '번호가 바뀐다');

  $(d, 'cards').querySelector('li').click();
  $(d, 'editDelete').click();
  eq(cards(d).length, 0, '지우기는 고치기 창 안에 있다');
  eq($(d, 'empty') !== null, true, '빈 목록 안내가 뜬다');
}

head('23. 이미 있는 번호로는 바꾸지 않는다');
{
  const d = await app(true);
  await mic(d);
  await say(d, '1021 대차');
  await until(() => cards(d).length === 1);
  await say(d, '1022 세차');
  await until(() => cards(d).length === 2);

  // 목록은 최근 것이 위 — 아래쪽이 1021
  const li = [...$(d, 'cards').querySelectorAll('li')].find((x) => x.textContent.startsWith('1021'));
  li.click();
  $(d, 'editPlate').value = '1022';
  $(d, 'editSave').click();
  eq($(d, 'editNote').textContent.includes('1022'), true, '왜 안 되는지 알려 준다');
  eq(d.defaultView.getComputedStyle($(d, 'editSheet')).display !== 'none', true, '창이 닫히지 않는다');
  eq(cards(d).length, 2, '목록은 그대로');
  $(d, 'editClose').click();
  eq(cards(d).map((c) => c[0]).sort(), ['1021', '1022'], '두 카드가 멀쩡하다');
}

wipe();
log('');
log(`${pass} 통과 / ${fail} 실패`, fail ? 'fail' : 'ok');
document.title = fail ? `FAIL ${fail}` : `PASS ${pass}`;
</script>
</body>
</html>
