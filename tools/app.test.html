<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>app.js 테스트</title>
<style>
  body { font: 13px/1.6 ui-monospace, Consolas, monospace; background:#14140f; color:#e8e2d2; padding:16px; }
  .fail { color:#ff8f6b; }
  .ok { color:#a9d18e; }
  iframe { position:absolute; left:-9999px; width:375px; height:812px; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
// 앱을 실제로 띄워 눌러 보는 검사. plate.js 처럼 순수한 로직이 아니라
// "누르면 무슨 일이 일어나는가" 를 본다.
//
// 앱을 iframe 으로 띄우면 같은 출처라 안을 그대로 조작할 수 있다.
// 끝나면 document.title 이 "PASS n" / "FAIL n" 이 된다 — 다른 테스트 페이지와 같다.
// 서버가 있어야 모듈을 읽는다:  python -m http.server 5181  뒤 /tools/app.test.html
const out = document.getElementById('out');
let pass = 0, fail = 0;
const log = (t, cls) => { const d = document.createElement('div'); d.className = cls || ''; d.textContent = t; out.appendChild(d); };
const eq = (actual, expected, label) => {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a === e) { pass++; log(`  ok   ${label}`, 'ok'); }
  else { fail++; log(`  FAIL ${label}\n       기대 ${e}\n       실제 ${a}`, 'fail'); }
};
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
// 머리 없는 브라우저는 시간을 앞당겨 돌린다. 몇 초가 아니라 "그렇게 될 때까지" 기다린다.
const until = async (ok, tries = 400) => {
  for (let i = 0; i < tries; i++) { if (ok()) return true; await wait(20); }
  return ok();
};

const DATE = (() => { const d = new Date(Date.now() - 9 * 3600e3); return d.toISOString().slice(0, 10); })();

function seed(yard, entries, round) {
  for (const k of Object.keys(localStorage)) if (k.startsWith('busyard:')) localStorage.removeItem(k);
  localStorage.setItem('busyard:yard', yard);
  localStorage.setItem(`busyard:v1:${yard}:${DATE}:1`, JSON.stringify({
    yard, date: DATE, round: 1, layout: 3, entries, updatedAt: new Date().toISOString(),
  }));
  localStorage.setItem(`busyard:round:${yard}`, String(round));
  localStorage.setItem(`busyard:roundDate:${yard}`, DATE);
  localStorage.setItem('busyard:targets', JSON.stringify([{ plate: '1777', kind: 'cctv' }]));
}

async function app() {
  document.querySelectorAll('iframe').forEach((f) => f.remove());
  const f = document.createElement('iframe');
  f.src = '/?t=' + Date.now();
  document.body.appendChild(f);
  await new Promise((r) => { f.onload = r; });
  await wait(600);
  const w = f.contentWindow, d = f.contentDocument;
  w.speechSynthesis.speak = (u) => { if (u.text) (w.__said = w.__said || []).push(u.text); };
  w.__said = [];
  return {
    d, w,
    $: (id) => d.getElementById(id),
    press: (k) => d.querySelector(`#padSheet [data-k="${k}"]`)
      .dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true, cancelable: true })),
    said: () => w.__said.filter((t) => t.length > 1),
  };
}

// ── 1) 2회차에서 전부 지우면 1회차 첫 자리로 돌아가야 한다
log('▶ 2회차에서 "오늘 입력·대상 전부 지우기"');
{
  const entries = {};
  for (let n = 1; n <= 20; n++) entries[n] = { plate: String(1500 + n), status: 'filled', confidence: 'high', round: n % 2 ? 1 : 2 };
  seed('new', entries, 2);
  const a = await app();

  eq(a.$('btnRound').textContent, '2회차', '시작은 2회차');
  // 2회차 도중 앱이 다시 떠도 확인 걸음을 이어 간다
  eq(a.$('padSheet').hidden, false, '2회차로 켜면 키패드가 열려 있다');
  eq(a.$('padTitle').textContent, 'B5-1번 자리', '돌던 자리에서 이어 간다');

  a.$('btnDiag').click(); await wait(120);
  a.$('diagClear').click(); await wait(80);          // 한 번 — 확인 받기
  eq(a.$('diagClear').classList.contains('armed'), true, '한 번 누르면 확인을 받는다');
  a.$('diagClear').click(); await wait(250);         // 두 번 — 실행

  eq(a.$('btnRound').textContent, '1회차', '지운 뒤에는 1회차');
  eq(a.d.body.classList.contains('round2'), false, '2회차 화면 색도 풀린다');
  eq(a.$('hudSpot').textContent, 'B5-1', '첫 자리로');
  eq(a.$('hudCount').textContent, '0 / 136', '판이 비었다');
  eq(a.$('padSheet').hidden, true, '키패드도 닫힌다');
  eq(a.$('diagSheet').hidden, true, '진단 화면도 닫힌다');
  eq(a.$('diagClear').textContent, '오늘 입력·대상 전부 지우기', '버튼 라벨이 되돌아온다');

  const key = `busyard:v1:new:${DATE}:1`;
  eq(Object.keys(JSON.parse(localStorage.getItem(key)).entries).length, 0, '저장된 판도 비었다');
  eq(JSON.parse(localStorage.getItem('busyard:targets') || '[]').length, 0, '찾을 차량도 비었다');
  eq(localStorage.getItem('busyard:round:new'), null, '저장된 회차도 지워진다');
  eq(JSON.parse(localStorage.getItem('busyard:cursor')).spot, 1, '저장된 커서도 1번');
}

// ── 2) 지운 뒤 다시 켜도 1회차 1번이어야 한다
log('▶ 지운 뒤 앱을 다시 켜면');
{
  const a = await app();
  eq(a.$('btnRound').textContent, '1회차', '다시 켜도 1회차');
  eq(a.$('hudSpot').textContent, 'B5-1', '다시 켜도 첫 자리');
  eq(a.$('padSheet').hidden, true, '1회차라 키패드는 닫힌 채');
}

// ── 3) 지운 뒤 넣는 것은 1회차 기록이어야 한다 (인쇄물에서 혼자 진해지면 안 된다)
log('▶ 지운 뒤 입력하면 1회차 기록');
{
  const a = await app();
  a.$('btnPad').click(); await wait(150);
  for (const k of ['2', '3', '4']) a.press(k);
  await wait(150);
  const e = JSON.parse(localStorage.getItem(`busyard:v1:new:${DATE}:1`)).entries[1];
  eq([e.plate, e.round], ['1234', 1], 'B5-1 에 1234 가 1회차로 들어간다');
}

// ── 4) 4초 뒤 저절로 풀릴 때도 라벨이 제자리로
log('▶ 한 번만 누르고 두면');
{
  const a = await app();
  a.$('btnDiag').click(); await wait(120);
  const label = a.$('diagClear').textContent;
  a.$('diagClear').click(); await wait(80);
  eq(a.$('diagClear').textContent !== label, true, '확인을 받는 동안에는 라벨이 바뀐다');
  await wait(4300);
  eq(a.$('diagClear').textContent, label, '4초 뒤 라벨이 제자리로');
  eq(a.$('diagClear').classList.contains('armed'), false, '빨간 표시도 풀린다');
}

// ── 5) 2회차 — CCTV·열쇠 수거 차량은 소리로 알려야 한다
log('▶ 2회차 확인 걸음의 음성');
{
  const entries = {};
  for (let n = 1; n <= 10; n++) entries[n] = { plate: String(1500 + n), status: 'filled', confidence: 'high', round: 1 };
  entries[3] = { plate: null, status: 'vacant', confidence: 'high', round: 1 };
  seed('new', entries, 1);
  localStorage.setItem('busyard:targets', JSON.stringify([
    { plate: '1502', kind: 'cctv' }, { plate: '1504', kind: 'key' },
  ]));
  const a = await app();
  a.$('btnRound').click(); await wait(400);      // 1회차 → 2회차 (확인 걸음 시작)

  const step = async () => {
    const n = a.w.__said.length;
    a.press('ok');
    await wait(150);
    return a.w.__said.slice(n).filter((t) => t.length > 1);
  };
  eq(a.said(), ['B5 1번, 천오백일'], '첫 자리는 구역 이름부터');
  eq(await step(), ['천오백이, 비디오'], 'CCTV 수거 차량이면 함께 알린다');
  eq(await step(), ['공차'], '공차는 공차라고만');
  eq(await step(), ['천오백사, 열쇠'], '열쇠 수거 차량도 알린다');
  eq(await step(), ['천오백오'], '대상이 아니면 번호만');
}

// ── 6) 일지를 저장하면 오늘 것을 지울지 묻는다
log('▶ 일지 저장 뒤 초기화');
{
  const entries = {};
  for (let n = 1; n <= 8; n++) entries[n] = { plate: String(1600 + n), status: 'filled', confidence: 'high', round: 1 };
  seed('new', entries, 2);
  const a = await app();

  a.$('btnLog').click(); await wait(150);
  eq(a.$('logReset').hidden, true, '저장 전에는 묻지 않는다');
  a.$('logSave').click(); await wait(250);
  eq(a.$('logReset').hidden, false, '저장하면 지울지 묻는다');

  a.$('logReset').click(); await wait(80);       // 한 번 — 확인
  a.$('logReset').click(); await wait(300);      // 두 번 — 실행
  eq(a.$('btnRound').textContent, '1회차', '지운 뒤 1회차');
  eq(a.$('hudCount').textContent, '0 / 136', '판이 비었다');
  eq(a.$('logSheet').hidden, true, '일지 화면이 닫힌다');
  eq(Object.keys(localStorage).filter((k) => k.startsWith('busyard:v1:log:')).length, 1, '일지는 남아 있다');
}

// ── 7) 일지 목록은 연·월로 접히고 묶음으로 지운다
log('▶ 일지 목록 묶기');
{
  for (const k of Object.keys(localStorage)) if (k.startsWith('busyard:')) localStorage.removeItem(k);
  const mk = (date) => localStorage.setItem(`busyard:v1:log:${date}`, JSON.stringify({
    date, yard: 'new', savedAt: `${date}T13:00:00.000Z`, layout: 3,
    entries: { 1: { plate: '1501', status: 'filled', round: 1 } }, targets: [],
  }));
  ['2025-11-03', '2026-08-30', '2026-09-26', '2026-09-27'].forEach(mk);
  const a = await app();
  a.$('btnLog').click(); await wait(250);

  const heads = (sel) => [...a.$('logList').querySelectorAll(sel)].map((el) => el.textContent.trim().split(/\s+/)[0]);
  eq(heads('.log-year > summary'), ['2026년', '2025년'], '연도는 내림차순');
  eq(heads('.log-month > summary'), ['9월', '8월', '11월'], '달도 내림차순 (연도 안에서)');

  const sep = a.$('logList').querySelector('[data-del-many="2026-09"]');
  sep.click(); await wait(80);                    // 한 번 — 확인
  eq(sep.classList.contains('armed'), true, '묶음 지우기는 한 번 더 묻는다');
  sep.click(); await wait(250);                   // 두 번 — 실행
  eq(Object.keys(localStorage).filter((k) => k.startsWith('busyard:v1:log:')).sort(),
    ['busyard:v1:log:2025-11-03', 'busyard:v1:log:2026-08-30'], '그 달만 지워진다');

  const y = a.$('logList').querySelector('[data-del-many="2025"]');
  y.click(); await wait(80);
  y.click(); await wait(250);
  eq(Object.keys(localStorage).filter((k) => k.startsWith('busyard:v1:log:')),
    ['busyard:v1:log:2026-08-30'], '연도 묶음도 지워진다');
}

// ── 8) 현장 사진 보내기 — 여러 개를 골라 한 번에, 찍힌 그대로
log('▶ 사진 보내기');
{
  seed('new', { 1: { plate: '1501', status: 'filled', round: 1 } }, 1);
  localStorage.setItem('busyard:ghtoken', '시험토큰');
  const a = await app();
  const puts = [];
  const real = a.w.fetch;
  a.w.fetch = (url, opt) => {
    if (opt && opt.method === 'PUT') {
      puts.push({ url: String(url), body: JSON.parse(opt.body) });
      return Promise.resolve(new a.w.Response(JSON.stringify({ content: { sha: 'x' } }), { status: 201 }));
    }
    if (String(url).includes('api.github.com')) return Promise.resolve(new a.w.Response('', { status: 404 }));
    return real(url, opt);
  };

  a.$('btnFiles').click(); await wait(80);
  eq(a.$('fileSheet').hidden, false, '[사진] 을 누르면 열린다 — 판이 비어 있어도');
  eq(a.$('fileSend').disabled, true, '고른 것이 없으면 보낼 수 없다');

  // 2x2 빨간 PNG 한 장 + 다른 파일 한 개
  const png = 'iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAACZgbYnAAAAFElEQVR4AWP4z8DwHwxpBqkGyQYAzUIJuV0AUeUAAAAASUVORK5CYII=';
  const bytes = Uint8Array.from(atob(png), (c) => c.charCodeAt(0));
  const pick = (...files) => {
    const dt = new a.w.DataTransfer();
    files.forEach((f) => dt.items.add(f));
    a.$('filePick').files = dt.files;
    a.$('filePick').dispatchEvent(new a.w.Event('change', { bubbles: true }));
  };

  pick(new a.w.File([bytes], '파손 사진:1.png', { type: 'image/png' }));
  await wait(80);
  eq(a.$('fileList').children.length, 1, '고른 것이 목록에 보인다');
  eq(a.$('fileSend').textContent, '1개 보내기', '몇 개인지 버튼에 적힌다');

  pick(new a.w.File([new Uint8Array(2048)], '뒷바퀴.jpg', { type: 'image/jpeg' }));
  await wait(80);
  eq(a.$('fileList').children.length, 2, '나눠 골라도 더해진다 (사진 보관함 + 파일)');
  eq(a.$('fileSend').textContent, '2개 보내기', '두 개로 센다');
  eq([...a.$('fileList').querySelectorAll('.sz')].map((e) => e.textContent), ['1KB', '2KB'],
    '크기를 보여 준다');

  a.$('fileSend').click();
  await until(() => puts.length >= 2 && !a.$('fileSend').disabled);
  eq(puts.length, 2, '고른 것을 모두 올린다');
  const photo = puts[0];
  eq(photo.url.includes(`/files/${DATE}/`), true, '날짜 폴더 아래에 놓인다');
  eq(/\d{6}-%ED%8C%8C%EC%86%90%20%EC%82%AC%EC%A7%84_1\.png$/.test(photo.url), true, '이름에 시각이 붙고 쓸 수 없는 글자는 _ 로 바뀐다');
  eq(photo.body.branch, 'inbox', 'inbox 가지로 간다');
  eq(photo.body.content, png, '찍힌 그대로 — 한 바이트도 줄이지 않는다');
  eq(a.$('fileMsg').textContent, '2개를 PC 다운로드 폴더로 보냈습니다', '보낸 결과를 보여 준다');
  eq(a.$('fileMsg').className, 'send-msg ok', '초록으로');
  eq([...a.$('fileList').querySelectorAll('.st')].map((e) => e.textContent), ['보냄', '보냄'],
    '하나씩 보냈다고 표시된다');
}

// ── 9) 토큰이 없으면 사진을 보내지 않는다
log('▶ 토큰 없이 사진 보내기');
{
  seed('new', { 1: { plate: '1501', status: 'filled', round: 1 } }, 1);
  const a = await app();
  let put = 0;
  const real = a.w.fetch;
  a.w.fetch = (url, opt) => {
    if (opt && opt.method === 'PUT') { put++; return Promise.resolve(new a.w.Response('{}', { status: 201 })); }
    return real(url, opt);
  };
  a.$('btnFiles').click(); await wait(80);
  eq(a.$('fileMsg').className, 'send-msg no', '열자마자 토큰이 없다고 알려 준다');

  const dt = new a.w.DataTransfer();
  dt.items.add(new a.w.File([new Uint8Array([1, 2, 3])], 'x.jpg', { type: 'image/jpeg' }));
  a.$('filePick').files = dt.files;
  a.$('filePick').dispatchEvent(new a.w.Event('change', { bubbles: true }));
  await wait(80);
  a.$('fileSend').click();
  await until(() => a.$('fileMsg').textContent.includes('토큰'));
  eq(put, 0, '올리려 하지 않는다');
  eq(a.$('fileMsg').className, 'send-msg no', '왜 안 되는지 빨갛게 알려 준다');
}

log(`\n통과 ${pass} / 실패 ${fail}`);
document.title = fail === 0 ? `PASS ${pass}` : `FAIL ${fail}`;
</script>
</body>
</html>
